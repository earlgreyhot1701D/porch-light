[project]
name = "porchlight"
version = "0.0.1"
description = "Agent that watches city meeting agendas for one person"
requires-python = ">=3.14"
license = "MIT"
readme = "README.md"

dependencies = [
    "bedrock-agentcore>=1.9.1",
    "strands-agents>=1.50.0",
    "structlog>=26.1.0",
    "tzdata>=2025.1",
    "beautifulsoup4>=4.13.0",
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porchlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: marks tests that hit real AWS services (deselected by default, run with make smoke)",
]
