[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "porchlight_spike"
version = "0.1.0"
description = "Porch Light Spike B — AgentCore deployment proof"
requires-python = ">=3.14"
# §32b: Pinned to exact versions resolved in uv.lock. The deployment has no
# downstream consumers to be flexible for, and structlog's redaction behavior
# is a security control. tests/test_deploy_pins.py asserts these match uv.lock.
dependencies = [
    "bedrock-agentcore==1.22.0",
    "strands-agents==1.53.0",
    "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
